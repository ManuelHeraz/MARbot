name: Deploy MARbot a GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Actualizando MARbot en GCP
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        script: |
          cd /home/hernandezdiazjm00/MARbot
          git pull origin main
          npm install
          npx pm2 restart "MARbot" || npx pm2 start src/index.js --name "MARbot"
